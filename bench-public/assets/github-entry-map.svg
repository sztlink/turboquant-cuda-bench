<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="read the repo as three paths">
  <defs>
    <pattern id="papergrain" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#f3ead7"/>
      <path d="M0 8h32M0 23h32M7 0v32M24 0v32" stroke="#d8c9aa" stroke-width="0.6" opacity="0.22"/>
      <circle cx="6" cy="6" r="0.7" fill="#9b8d74" opacity="0.18"/><circle cx="22" cy="18" r="0.6" fill="#9b8d74" opacity="0.14"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .tag { font-size: 13px; font-weight: 700; letter-spacing: 2.2px; fill: #a33a2b; text-transform: uppercase; }
      .title { font-size: 48px; font-weight: 800; letter-spacing: -2px; fill: #171717; }
      .sub { font-size: 18px; fill: #5f594f; }
      .small { font-size: 13px; fill: #5f594f; }
      .label { font-size: 16px; fill: #171717; }
      .num { font-size: 42px; font-weight: 800; fill: #171717; letter-spacing: -1px; }
      .micro { font-size: 11px; fill: #5f594f; letter-spacing: 1.1px; text-transform: uppercase; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#papergrain)"/>
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#24221e" stroke-width="1.5"/>
  <text x="58" y="68" class="mono tag">turboquant-cuda-bench</text>
  <text x="58" y="126" class="mono title">read the repo as three paths</text>
  <text x="58" y="160" class="mono sub">Less inventory, more behavior</text>
  
    <g transform="translate(70 220)">
      <rect width="318" height="220" fill="#fff7e8" stroke="#24221e"/>
      <text x="28" y="48" class="mono micro">path 1</text><text x="28" y="86" class="mono label">Evidence utilization</text><text x="28" y="124" class="mono small">FOUND → PRESENTED → USED</text><text x="28" y="158" class="mono small">Why retrieval is not answer closure.</text>
      <rect x="366" width="318" height="220" fill="#fff7e8" stroke="#24221e"/>
      <text x="394" y="48" class="mono micro">path 2</text><text x="394" y="86" class="mono label">Bridge methodology</text><text x="394" y="124" class="mono small">action · target · source-rank</text><text x="394" y="158" class="mono small">Compression changes split layers.</text>
      <rect x="732" width="318" height="220" fill="#fff7e8" stroke="#24221e"/>
      <text x="760" y="48" class="mono micro">path 3</text><text x="760" y="86" class="mono label">Evidence-Paged KV</text><text x="760" y="124" class="mono small">kernel receipts · telemetry</text><text x="760" y="158" class="mono small">Exploratory, not production hook.</text>
    </g>
</svg>