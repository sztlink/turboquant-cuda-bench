<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Not all distractors are equal">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17202f"/>
      <stop offset="0.55" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#090a0d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .title { font-size: 44px; font-weight: 800; letter-spacing: -1.8px; fill: #e8edf2; }
      .sub { font-size: 18px; fill: #91a0ad; }
      .axis { font-size: 13px; fill: #91a0ad; }
      .label { font-size: 15px; fill: #e8edf2; }
      .small { font-size: 12px; fill: #91a0ad; }
      .big { font-size: 42px; font-weight: 800; fill: #e8edf2; letter-spacing: -1px; }
      .kicker { font-size: 12px; fill: #7df9ff; letter-spacing: 2.5px; text-transform: uppercase; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>
  <circle cx="130" cy="-80" r="260" fill="#24344f" opacity="0.35"/>
  <circle cx="1120" cy="560" r="320" fill="#16303a" opacity="0.32"/>
  <text x="56" y="64" class="mono kicker">turboquant-cuda-bench</text>
  <text x="56" y="118" class="mono title">Not all distractors are equal</text>
  <text x="56" y="150" class="mono sub">Stale and correction-like records are much harder than unrelated noise</text>
  
    <rect x="56" y="184" width="1088" height="380" rx="24" fill="#151922" stroke="#2a3240" filter="url(#shadow)"/>
    
      <text x="92" y="202" class="mono label">unrelated noise</text>
      <rect x="92" y="210" width="960" height="16" rx="8" fill="#202735"/>
      <rect x="92" y="210" width="808.3" height="16" rx="8" fill="#9cff87"/>
      <text x="1070" y="223" class="mono label">84.2%</text>
      <text x="92" y="254" class="mono label">explicit decoy</text>
      <rect x="92" y="262" width="960" height="16" rx="8" fill="#202735"/>
      <rect x="92" y="262" width="558.7" height="16" rx="8" fill="#ffcc66"/>
      <text x="1070" y="275" class="mono label">58.2%</text>
      <text x="92" y="306" class="mono label">conflicting correction</text>
      <rect x="92" y="314" width="960" height="16" rx="8" fill="#202735"/>
      <rect x="92" y="314" width="520.3" height="16" rx="8" fill="#ffcc66"/>
      <text x="1070" y="327" class="mono label">54.2%</text>
      <text x="92" y="358" class="mono label">near duplicate</text>
      <rect x="92" y="366" width="960" height="16" rx="8" fill="#202735"/>
      <rect x="92" y="366" width="441.6" height="16" rx="8" fill="#ffcc66"/>
      <text x="1070" y="379" class="mono label">46.0%</text>
      <text x="92" y="410" class="mono label">stale record</text>
      <rect x="92" y="418" width="960" height="16" rx="8" fill="#202735"/>
      <rect x="92" y="418" width="346.6" height="16" rx="8" fill="#ff6b6b"/>
      <text x="1070" y="431" class="mono label">36.1%</text>
    <text x="92" y="540" class="mono small">Metric: answer closure in the promoted synthetic distractor taxonomy sweep.</text>
</svg>
